# Блок HTTPS. Кладётся в docker/nginx/conf.d/ скриптом установки,
# когда в .env включён ENABLE_HTTPS=true.
#
# Зачем вообще HTTPS во внутренней сети: браузеры дают доступ к микрофону
# и камере только на защищённых страницах. Без HTTPS запись голосового
# с телефона по сети работать не будет — ни в Chrome, ни в Safari.

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    proxy_read_timeout 900;
    fastcgi_read_timeout 900;
    fastcgi_send_timeout 900;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
}
