server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    # Модель отвечает не мгновенно. Без этих таймаутов nginx обрывает
    # запрос на 60-й секунде и пользователь видит 504 вместо ответа.
    proxy_read_timeout 900;
    fastcgi_read_timeout 900;
    fastcgi_send_timeout 900;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        # Потоковый ответ чата отдаём кусками, как они приходят.
        # Приложение просит это заголовком X-Accel-Buffering: no,
        # но gzip всё равно копил бы данные — поэтому он ниже отключён
        # для потока.
        fastcgi_buffering off;

        # Не обрывать запрос к приложению, когда браузер закрыл вкладку.
        # Ответ модели считается десятки секунд, и человек вполне может
        # уйти на полпути. Без этого nginx закрывает соединение с php-fpm,
        # скрипт умирает до сохранения — и в переписке остаётся вопрос
        # без ответа, хотя модель ответ уже придумала.
        fastcgi_ignore_client_abort on;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
}
