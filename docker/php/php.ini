; Документы бывают большими, а ответы модели — долгими.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 900

; Модель может думать минутами — держим соединение.
default_socket_timeout = 900

; Потоковый ответ чата (Server-Sent Events) должен уходить сразу,
; а не копиться в буфере до конца запроса.
output_buffering = Off
zlib.output_compression = Off
implicit_flush = On

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

date.timezone = Europe/Moscow
