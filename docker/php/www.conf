; Настройки пула php-fpm.
;
; Зачем: потоковый ответ чата держит воркер всё время, пока модель пишет
; ответ — это десятки секунд. В стандартном образе воркеров всего пять,
; и уже пятый одновременный вопрос вешает приложение целиком: шестой
; пользователь не получит даже страницу входа.
;
; Памяти это почти не стоит: воркер без работы занимает единицы мегабайт.

[www]
user = app
group = app
listen = 9000

pm = dynamic
pm.max_children = 40
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12

; Перезапуск воркера после 500 запросов — страховка от утечек памяти
; в долгоживущих процессах.
pm.max_requests = 500

; Долгие запросы (поток ответа, разбор большого pdf) не убиваем.
request_terminate_timeout = 900

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
